<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vyhledávání obrázků přes Google.">
  <title>Vyhledávání obrázků</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body class="search-page">
  <header class="site-header">
    <nav aria-label="Hlavní navigace">
      <a href="index.html">Google Search</a>
      <a href="advanced.html">Rozšířené vyhledávání</a>
      <a href="forms.html">Formuláře</a>
      <a href="https://onndrys.github.io/github/" target="_blank" rel="noopener noreferrer">Portfolio</a>
    </nav>
  </header>

  <main class="home-main">
    <h1 class="wordmark image-wordmark">Obrázky</h1>
    <form class="search-form" action="https://www.google.com/search" method="get">
      <input type="hidden" name="udm" value="2">
      <label class="visually-hidden" for="image-query">Hledat obrázky</label>
      <input class="search-input" id="image-query" type="search" name="q" title="Hledat obrázky" autocomplete="off">
      <div class="search-actions">
        <button class="button" type="submit">Hledat obrázky</button>
      </div>
    </form>
  </main>

  <footer class="site-footer">
    <div class="footer-links">
      <a class="portfolio-link" data-portfolio-link>Portfolio</a>
      <a href="citace.md" data-citations-link>Citace a zdroje</a>
      <a href="https://validator.w3.org/nu/" data-html-validator>Validace HTML</a>
      <a href="https://jigsaw.w3.org/css-validator/" data-css-validator>Validace CSS</a>
    </div>
  </footer>
</body>
</html>
