<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ukázka různých druhů HTML formulářových prvků.">
  <title>Ukázka formulářů</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav aria-label="Hlavní navigace">
      <a href="index.html">Google Search</a>
      <a href="images.html">Obrázky</a>
      <a href="advanced.html">Rozšířené vyhledávání</a>
    </nav>
  </header>

  <main class="forms-main">
    <h1>Ukázka formulářových prvků</h1>
    <p class="demo-notice"><strong>Ukázkový formulář není funkční.</strong> Údaje se nikam neodesílají ani neukládají.</p>

    <form class="demo-form">
      <fieldset>
        <legend>Textové údaje</legend>
        <label for="full-name">Jméno a příjmení</label>
        <input id="full-name" name="full-name" type="text" placeholder="Jan Novák">

        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="jan@example.cz">

        <label for="password">Heslo</label>
        <input id="password" name="password" type="password" autocomplete="new-password">

        <label for="website">Webová stránka</label>
        <input id="website" name="website" type="url" placeholder="https://example.cz">

        <label for="phone">Telefon</label>
        <input id="phone" name="phone" type="tel" placeholder="+420 123 456 789">

        <label for="search-demo">Vyhledávání</label>
        <input id="search-demo" name="search-demo" type="search" placeholder="Hledaný výraz">
      </fieldset>

      <fieldset>
        <legend>Výběr možností</legend>
        <label for="class">Třída</label>
        <select id="class" name="class">
          <option value="">Vyberte třídu</option>
          <option value="1">1. ročník</option>
          <option value="2">2. ročník</option>
          <option value="3">3. ročník</option>
          <option value="4">4. ročník</option>
        </select>

        <label for="topic">Oblíbené téma</label>
        <input id="topic" name="topic" list="topics" placeholder="Vyberte nebo napište">
        <datalist id="topics">
          <option value="Programování">
          <option value="Design">
          <option value="Fotografie">
        </datalist>

        <span class="group-label">Preferovaný kontakt</span>
        <label class="choice"><input type="radio" name="contact" value="email"> E-mail</label>
        <label class="choice"><input type="radio" name="contact" value="phone"> Telefon</label>

        <span class="group-label">Zájmy</span>
        <label class="choice"><input type="checkbox" name="interests" value="web"> Tvorba webu</label>
        <label class="choice"><input type="checkbox" name="interests" value="design"> Grafický design</label>
        <label class="choice"><input type="checkbox" name="interests" value="coding"> Programování</label>
      </fieldset>

      <fieldset>
        <legend>Další vstupy</legend>
        <label for="birth-date">Datum narození</label>
        <input id="birth-date" name="birth-date" type="date">

        <label for="meeting-time">Čas schůzky</label>
        <input id="meeting-time" name="meeting-time" type="time">

        <label for="month">Oblíbený měsíc</label>
        <input id="month" name="month" type="month">

        <label for="week">Týden projektu</label>
        <input id="week" name="week" type="week">

        <label for="color">Oblíbená barva</label>
        <input id="color" name="color" type="color" value="#4285f4">

        <label for="rating">Hodnocení (1–10)</label>
        <input id="rating" name="rating" type="range" min="1" max="10" value="5">

        <label for="quantity">Počet položek</label>
        <input id="quantity" name="quantity" type="number" min="0" max="99" value="1">

        <label for="message">Zpráva</label>
        <textarea id="message" name="message" rows="5" placeholder="Napište zprávu…"></textarea>

        <label class="choice"><input type="checkbox" name="consent" value="yes"> Souhlasím s ukázkovými podmínkami</label>
        <button class="button" type="button" disabled>Odeslat (nefunkční ukázka)</button>
        <button class="button secondary-button" type="reset">Vymazat</button>
      </fieldset>
    </form>
  </main>

  <footer class="site-footer">
    <div class="footer-links">
      <a class="portfolio-link" data-portfolio-link>Portfolio</a>
      <a href="citace.md" data-citations-link>Citace a zdroje</a>
      <a href="https://validator.w3.org/nu/" data-html-validator>Validace HTML</a>
      <a href="https://jigsaw.w3.org/css-validator/" data-css-validator>Validace CSS</a>
    </div>
  </footer>
</body>
</html>
